name: 'Pull Request - Merge'

on:
  workflow_call:
    inputs:
      projectType:
        description: "One or more Project Types to Bump the Version for: npm, dotnet, react-native, ionic-capacitor, reactnative-expo"
        required: false
        type: string
      gra-app-client-id:
        description: "GitHub Release Automation App Client ID"
        required: true
        type: string
    secrets:
      gra-app-private-key:
        description: "GitHub Release Automation App Private Key"
        required: true

defaults:
  run:
    shell: bash

jobs:
  bump-version-tag:
    name: 'Bump Version and Tag'
    if: ${{ github.event.pull_request.merged == true && (contains(github.event.pull_request.labels.*.name, 'version:major') || contains(github.event.pull_request.labels.*.name, 'version:minor') || contains(github.event.pull_request.labels.*.name, 'version:patch')) }}
    runs-on: ubuntu-latest
    # Bump Jobs for the same Base Branch run one at a time (Concurrency Groups are per Repository) so each Merge computes
    # its Version from the previous Job's Tag and pushes onto its Commit. queue: max keeps every waiting Job instead of
    # cancelling all but the newest, so a burst of Merges still produces one Version and Tag per Pull Request.
    concurrency:
      group: pr-merge-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.gra-app-client-id }}
          private-key: ${{ secrets.gra-app-private-key }}
          permission-contents: write

      - name: Checkout Merge Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Get GitHub App User ID
        id: app-user
        run: |
          echo "user_id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.app-user.outputs.user_id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"

      # The Base Branch may have moved on since this Pull Request was merged (another Merge or Push), so bump the Version on
      # its current Tip rather than on the Merge Commit. The fresh Tags also make the previous Tag lookup see Tags pushed by
      # Bump Jobs that ran while this one was queued.
      - name: Sync with Base Branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git fetch --force --tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          if ! git merge-base --is-ancestor "${MERGE_SHA}" "origin/${BASE_REF}"; then
            echo "::error::Merge Commit ${MERGE_SHA} is no longer on '${BASE_REF}' - not Bumping the Version or Tagging a Branch that does not contain this Pull Request"
            exit 1
          fi

          git checkout --quiet --detach "origin/${BASE_REF}"
          echo "Bumping the Version on '${BASE_REF}' at $(git rev-parse --short HEAD) (Merge Commit ${MERGE_SHA:0:7})"

      # The newest Tag by creation date, as before, but tie-broken by Version rather than by name: Bump Jobs that change no
      # files tag the Base Branch Tip directly, so successive Releases can share one Commit (and creation date), and a name
      # sort would put 1.0.9 above 1.0.10 and make the next Job try to create a Tag that already exists.
      - name: Get Previous Tag
        id: previousTag
        run: |
          TAG="$(git for-each-ref --sort=-version:refname --sort=-creatordate --count 1 --format='%(refname:short)' 'refs/tags/*')"

          if [[ -z "${TAG}" ]]; then
            echo "No previous Tag found - falling back to 1.0.0"
            TAG="1.0.0"
          fi

          echo "Previous Tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Get Next Versions
        id: nextVersions
        uses: WyriHaximus/github-action-next-semvers@v1
        with:
          version: ${{ steps.previousTag.outputs.tag }}

      - name: Determine New Version
        id: newVersion
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'version:major') }}" == "true" ]]; then
            echo "version=${{ steps.nextVersions.outputs.major }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'version:minor') }}" == "true" ]]; then
            echo "version=${{ steps.nextVersions.outputs.minor }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'version:patch') }}" == "true" ]]; then
            echo "version=${{ steps.nextVersions.outputs.patch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update NPM Version
        if: ${{ contains(inputs.projectType, 'npm') }}
        run: |
          npm config set allow-same-version true
          npm config set commit-hooks false
          npm config set git-tag-version false
          npm --no-git-tag-version version ${{ steps.newVersion.outputs.version }}

      - name: Update DotNet Version
        if: ${{ contains(inputs.projectType, 'dotnet') }}
        run: |
          if [[ -d "./Properties" ]] && [[ -f "./Properties/AssemblyInfo.cs" ]]; then
            sed -i "s/${{ steps.previousTag.outputs.tag }}/${{ steps.newVersion.outputs.version }}/g" ./Properties/AssemblyInfo.cs
          else
            find . -name "*.csproj" -exec sed -i "s/<Version>${{ steps.previousTag.outputs.tag }}<\/Version>/<Version>${{ steps.newVersion.outputs.version }}<\/Version>/g" {} +
          fi

      - name: Update React Native Version
        if: ${{ contains(inputs.projectType, 'react-native') }}
        run: |
          VERSION_NAME="${{ steps.newVersion.outputs.version }}"
          MAJOR="${VERSION_NAME%%.*}"
          REST="${VERSION_NAME#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST##*.}"
          PATCH="${PATCH%%[^0-9]*}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          npm config set allow-same-version true
          npm config set commit-hooks false
          npm config set git-tag-version false
          npm --no-git-tag-version version "${VERSION_NAME}"

          find . -type f -name "build.gradle" -exec sed -i -E "s#^([[:space:]]*versionName([[:space:]]*=[[:space:]]*|[[:space:]]+)).*\$#\\1\"${VERSION_NAME}\"#" {} +
          find . -type f -name "build.gradle" -exec sed -i -E "s#^([[:space:]]*versionCode([[:space:]]*=[[:space:]]*|[[:space:]]+)).*\$#\\1${VERSION_CODE}#" {} +

          find . -type f -name "project.pbxproj" -exec sed -i -E "s#^([[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*)[^;]*([[:space:]]*;.*)\$#\\1${VERSION_NAME}\\2#" {} +
          find . -type f -name "project.pbxproj" -exec sed -i -E "s#^([[:space:]]*CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*)[^;]*([[:space:]]*;.*)\$#\\1${VERSION_CODE}\\2#" {} +
      
      - name: Update Ionic / Capacitor Version
        if: ${{ contains(inputs.projectType, 'ionic-capacitor') }}
        run: |
          VERSION_NAME="${{ steps.newVersion.outputs.version }}"
          MAJOR="${VERSION_NAME%%.*}"
          REST="${VERSION_NAME#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST##*.}"
          PATCH="${PATCH%%[^0-9]*}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          npm config set allow-same-version true
          npm config set commit-hooks false
          npm config set git-tag-version false
          npm --no-git-tag-version version "${VERSION_NAME}"

          find . -type f -name "build.gradle" -exec sed -i -E "s#^([[:space:]]*versionName([[:space:]]*=[[:space:]]*|[[:space:]]+)).*\$#\\1\"${VERSION_NAME}\"#" {} +
          find . -type f -name "build.gradle" -exec sed -i -E "s#^([[:space:]]*versionCode([[:space:]]*=[[:space:]]*|[[:space:]]+)).*\$#\\1${VERSION_CODE}#" {} +

          find . -type f -name "project.pbxproj" -exec sed -i -E "s#^([[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*)[^;]*([[:space:]]*;.*)\$#\\1${VERSION_NAME}\\2#" {} +
          find . -type f -name "project.pbxproj" -exec sed -i -E "s#^([[:space:]]*CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*)[^;]*([[:space:]]*;.*)\$#\\1${VERSION_CODE}\\2#" {} +
      
      - name: Update React Native Expo Version
        if: ${{ contains(inputs.projectType, 'reactnative-expo') }}
        run: |
          VERSION_NAME="${{ steps.newVersion.outputs.version }}"
          MAJOR="${VERSION_NAME%%.*}"
          REST="${VERSION_NAME#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST##*.}"
          PATCH="${PATCH%%[^0-9]*}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          if [ -f app.json ]; then
            sed -i -E "s#^([[:space:]]*\"version\"[[:space:]]*:[[:space:]]*)\"[^\"]*\"([[:space:]]*,?)\$#\\1\"${VERSION_NAME}\"\\2#" app.json
            sed -i -E "s#^([[:space:]]*\"buildNumber\"[[:space:]]*:[[:space:]]*)(\"[^\"]*\"|[0-9]+)([[:space:]]*,?)\$#\\1\"${VERSION_CODE}\"\\3#" app.json
            sed -i -E "s#^([[:space:]]*\"versionCode\"[[:space:]]*:[[:space:]]*)(\"[0-9]+\"|[0-9]+)([[:space:]]*,?)\$#\\1${VERSION_CODE}\\3#" app.json
          fi

          if [ -f app.config.ts ]; then
            sed -i -E "s#^([[:space:]]*['\"]?version['\"]?[[:space:]]*:[[:space:]]*)[^,/}]+([[:space:]]*,?[[:space:]]*(//.*)?)\$#\\1'${VERSION_NAME}'\\2#" app.config.ts
            sed -i -E "s#^([[:space:]]*['\"]?buildNumber['\"]?[[:space:]]*:[[:space:]]*)[^,/}]+([[:space:]]*,?[[:space:]]*(//.*)?)\$#\\1'${VERSION_CODE}'\\2#" app.config.ts
            sed -i -E "s#^([[:space:]]*['\"]?versionCode['\"]?[[:space:]]*:[[:space:]]*)[^,/}]+([[:space:]]*,?[[:space:]]*(//.*)?)\$#\\1${VERSION_CODE}\\2#" app.config.ts
          fi

      - name: Verify Changed Files
        id: changedFiles
        env:
          PROJECT_TYPE: ${{ inputs.projectType }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "files_changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          else
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No files were changed by the Version Bump for Project Type(s) '${PROJECT_TYPE//$'\n'/ }' - the Tag will point at the current '${BASE_REF}' Commit"
          fi

      - name: Add, Commit and Push Changes
        if: steps.changedFiles.outputs.files_changed == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          VERSION: ${{ steps.newVersion.outputs.version }}
        run: |
          git add -A
          git commit -m "${VERSION}"

          # A Push can still land on the Base Branch between the Sync and this Push (a direct Push or a version:none Merge),
          # so rebase the single Version Bump Commit onto the latest Base Branch and retry a bounded number of times.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BASE_REF}"; then
              exit 0
            fi

            if [[ "${attempt}" -eq 3 ]]; then
              break
            fi

            echo "::warning::Push to '${BASE_REF}' was rejected (attempt ${attempt} of 3) - rebasing the Version Bump onto the latest '${BASE_REF}' and retrying"
            git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

            # Only the Version Bump Commit may be replayed: if the Commit it was built on is no longer on the Base Branch, the
            # Branch was rewritten and a rebase would restore the removed Commits (possibly this Pull Request) and tag them.
            if ! git merge-base --is-ancestor HEAD~1 "origin/${BASE_REF}"; then
              echo "::error::'${BASE_REF}' was rewritten while this Job was running - re-run this Job to Bump the Version and Tag the latest '${BASE_REF}'"
              exit 1
            fi

            if ! git rebase "origin/${BASE_REF}"; then
              git rebase --abort
              echo "::error::The Version Bump conflicts with new Commits on '${BASE_REF}' - re-run this Job to Bump the Version and Tag the latest '${BASE_REF}'"
              exit 1
            fi
          done

          echo "::error::Could not push the Version Bump to '${BASE_REF}' after 3 attempts"
          exit 1

      - name: Tag and Push
        run: |
          git tag "${{ steps.newVersion.outputs.version }}"
          git push origin "${{ steps.newVersion.outputs.version }}"
